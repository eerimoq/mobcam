name: Check Code Formatting 🛠️
on:
  workflow_call:
jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Up Rust 🦀
        run: rustup show active-toolchain
      - name: rustfmt check 🦀
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Up Environment 🔧
        run: |
          # bindgen needs the same headers the plugin links against, which is
          # what build.rs finds through pkg-config here.
          sudo add-apt-repository --yes ppa:obsproject/obs-studio
          sudo apt-get --quiet update
          sudo apt-get --quiet --yes --no-install-recommends install \
            libclang-dev libobs-dev libavcodec-dev libavutil-dev libsimde-dev pkg-config
      - name: Set Up Rust 🦀
        run: rustup show active-toolchain
      - name: clippy check 🦀
        # The C build treated warnings as errors, so the Rust one does too.
        run: cargo clippy --all-targets -- --deny warnings
