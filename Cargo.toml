[package]
name = "mobcam"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "mobcam"
path = "src/lib.rs"
crate-type = ["cdylib"]

[build-dependencies]
bindgen = "0.72"
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
cc = "1"

[profile.release]
panic = "unwind"
debug = true

[dependencies]
plist = { version = "1.10.0" }
